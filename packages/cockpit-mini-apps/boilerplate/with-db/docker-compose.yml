services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-miniapp}:${DB_PASS:-miniapp}@db:5432/${DB_NAME:-miniapp}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - DEBUG=${DEBUG:-true}
      - APP_NAME={{PROJECT_NAME_TITLE}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-miniapp}
      - POSTGRES_PASSWORD=${DB_PASS:-miniapp}
      - POSTGRES_DB=${DB_NAME:-miniapp}
    volumes:
      - ./db/data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-miniapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
