name: vercel
version: 0.1.0
description: "Vercel named accounts, vault-backed tokens, API and CLI shortcuts."
author: lleitep3
license: MIT
type: plugin
category: infrastructure
requirements:
  cockpit: ">=0.1.0"
external-dependencies:
  system:
    - bash
    - python3
features:
  modules:
    - path: bin/vercel
      name: vercel
      description: "Manage Vercel with explicit Cockpit profiles."
  skills:
    - path: skills/vercel
      name: vercel
      description: "Operate Vercel through Cockpit profiles and official references."
installation:
  supported_providers:
    - codex
  provider_features:
    codex:
      - modules
      - skills
  method: copy
metadata:
  tags: [vercel, deployment, accounts, vault, api]
  status: beta
