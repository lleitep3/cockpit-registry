name: github-tools
version: 0.2.1
description: GitHub CLI integration for AICockpit. Wraps gh with vault-backed authentication and adds AI-friendly commands for Actions, commits, PRs and reviews.
author: AICockpit
license: MIT
type: tool
category: productivity
requirements:
    cockpit: '>=0.4.0'
external-dependencies:
    system:
        - gh >= 2.50.0
features:
    skills:
        - path: skills/github
          name: github
    rules:
        - path: rules/github.md
          name: github
    modules:
        - path: bin/github-tools
          name: github
          description: GitHub CLI wrapper with vault-backed authentication
    gold_rules:
        - Whenever you need to interact with GitHub (search code, view issues/PRs, run or inspect Actions, list commits, comment, approve, or resolve review threads), always use `cockpit github <command>` instead of calling `gh` directly.
        - The `github-tools` package reads the GitHub token from the AICockpit vault and injects it into every `gh` invocation, so you do not need to manage authentication yourself.
installation:
    supported_providers:
        - devin
        - goose
        - antigravity
        - windsurf
        - cursor
    provider_features:
        antigravity:
            - github
        cursor:
            - github
        devin:
            - github
        goose:
            - github
        windsurf:
            - github
    method: ""
metadata:
    tags:
        - github
        - gh
        - ci/cd
        - pull-request
    status: beta
