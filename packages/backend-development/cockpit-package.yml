name: "backend-development"
version: "0.2.0"
description: "Backend API development with Clean Architecture, explicit ports, test-first use cases and production boundaries."
author: "lleitep3"
license: "MIT"
type: plugin
category: development

requirements:
  cockpit: ">=0.1.0"

features:
  skills:
    - path: "skills/api-developer"
      name: "api-developer"
      description: "Planejamento e implementação de APIs com Clean Architecture e testes orientados por comportamento."
    - path: "skills/use-case-planner"
      name: "use-case-planner"
      description: "Mapeamento reproduzível de fluxos de usuário e casos de uso com entregáveis documentais."
  kb:
    - path: "kb/guides/backend-development.md"
      type: "guide"

installation:
  supported_providers:
    - codex
  provider_features:
    codex:
      - skills/api-developer
      - skills/use-case-planner
      - kb
  method: "copy"

metadata:
  tags:
    - backend
    - api
    - clean-architecture
    - testing
    - typescript
    - nestjs
  keywords:
    - backend development
    - API development
    - clean architecture
    - test-first
    - ports and adapters
  status: "beta"
  support:
    issues: "https://github.com/lleitep3/aicockpit/issues"
