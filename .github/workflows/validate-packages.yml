name: Validate Packages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ── 1. Unit-test the validation scripts themselves ────────────────────────
  test-scripts:
    name: Test validation scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run unit tests for validate_packages.py
        run: python -m pytest scripts/test_validate_packages.py -v

  # ── 2. Validate the full registry (all packages) ─────────────────────────
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    needs: test-scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate registry
        run: |
          ./scripts/validate-registry.sh

  # ── 3. PR-specific checks (one package per PR, version bump) ─────────────
  validate-pr:
    name: Validate PR rules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test-scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate PR
        run: |
          ./scripts/validate-pr.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
